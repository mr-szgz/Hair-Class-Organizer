[project]
name = "hair-class-organizer"
version = "0.1.2"
description = "Classify hair color in images and video snapshots, then organize the original media by class"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1",
    "opencv-python>=4.10",
    "pillow>=10",
    "platformdirs>=4",
    "safetensors>=0.8",
    "timm>=1.0",
    "torch",
    "torchvision",
    "transformers>=4.57,<6",
]

[project.scripts]
hair-class-organizer = "app.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.models"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
